name: Temporary Trusted Access Integration

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[automation] apply trusted access'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: agent/26.2-6-dev
          fetch-depth: 0

      - name: Apply remaining trusted-access patches
        shell: bash
        run: |
          set -euo pipefail
          for patch_file in \
            .github/trust-patches/01-protection.patch \
            .github/trust-patches/03-mailbox-holder.patch \
            .github/trust-patches/04-mailbox-menu.patch \
            .github/trust-patches/05-shop-listener.patch \
            .github/trust-patches/06-shop-menu.patch
          do
            echo "Applying $patch_file"
            patch -p2 --forward --batch < "$patch_file"
          done

      - name: Update plugin command metadata
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/main/resources/plugin.yml')
          text = path.read_text(encoding='utf-8')
          old_usage = '    usage: /fs [give masterkey [player]|reload]'
          new_usage = '    usage: /fs [trust <player> [access|manage]|untrust <player>|trusted|give masterkey [player]|reload]'
          if text.count(old_usage) != 1:
              raise SystemExit('Could not update command usage in plugin.yml')
          text = text.replace(old_usage, new_usage, 1)

          marker = '  fragstealers.masterkey.give:\n'
          permission = (
              '  fragstealers.trust.manage:\n'
              '    description: Allows owners to manage trusted players on their FragStealers protections.\n'
              '    default: true\n'
          )
          if text.count(marker) != 1:
              raise SystemExit('Could not add trust permission to plugin.yml')
          text = text.replace(marker, permission + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary branch staging files
        run: |
          rm -rf .github/trust-patches
          rm -f .github/workflows/apply-trust-integration.yml

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and verify
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          test -f build/libs/FragStealers-26.2-6.jar
          jar tf build/libs/FragStealers-26.2-6.jar | grep -qx plugin.yml
          jar tf build/libs/FragStealers-26.2-6.jar | grep -qx config.yml

      - name: Commit completed source integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integrate trusted player access'
          git push origin HEAD:agent/26.2-6-dev

      - name: Record completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --body 'Trusted access source patches applied and Java 25 build passed.'
          gh issue close "${{ github.event.issue.number }}" --reason completed
