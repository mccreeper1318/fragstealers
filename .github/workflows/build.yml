name: Build FragStealers

run-name: Build FragStealers from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - "agent/**"
      - "dev/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Determine build version
        id: version
        shell: bash
        run: |
          PROJECT_VERSION="$(
            sed -nE \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              build.gradle.kts \
              | head -n 1
          )"

          if [[ -z "$PROJECT_VERSION" ]]; then
            echo "Could not read the project version from build.gradle.kts."
            exit 1
          fi

          BUILD_VERSION="$PROJECT_VERSION"
          RELEASE_TAG=""
          PUBLISH_PRERELEASE=false

          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == refs/heads/agent/* ]]; then
            COMMIT_MESSAGE="$(git log -1 --pretty=%B)"

            if [[ "$COMMIT_MESSAGE" =~ \[prerelease[[:space:]]+([0-9]+\.[0-9]+-[0-9]+-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)\] ]]; then
              RELEASE_TAG="${BASH_REMATCH[1]}"
              BUILD_VERSION="$RELEASE_TAG"
              PUBLISH_PRERELEASE=true

              if [[ "$RELEASE_TAG" =~ ^([0-9]+\.[0-9]+-[0-9]+)-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*$ ]]; then
                BASE_VERSION="${BASH_REMATCH[1]}"
              else
                echo "Invalid prerelease marker version: $RELEASE_TAG"
                exit 1
              fi

              if [[ "$PROJECT_VERSION" != "$BASE_VERSION" ]]; then
                echo "Prerelease marker base version does not match the Gradle project version."
                echo "Prerelease version: $RELEASE_TAG"
                echo "Base version:       $BASE_VERSION"
                echo "Project version:    $PROJECT_VERSION"
                exit 1
              fi

              RELEASE_IS_PRERELEASE="$(
                gh release view "$RELEASE_TAG" \
                  --json isPrerelease \
                  --jq '.isPrerelease'
              )"

              if [[ "$RELEASE_IS_PRERELEASE" != "true" ]]; then
                echo "$RELEASE_TAG must already exist as a GitHub prerelease."
                exit 1
              fi
            fi
          fi

          echo "project_version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "publish_prerelease=$PUBLISH_PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "Project version: $PROJECT_VERSION"
          echo "Build version:   $BUILD_VERSION"
          echo "Publish release: $PUBLISH_PRERELEASE"

      - name: Apply build version
        if: steps.version.outputs.build_version != steps.version.outputs.project_version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.build_version }}"

          python3 - "$VERSION" <<'PY'
          import pathlib
          import re
          import sys

          version = sys.argv[1]
          path = pathlib.Path("build.gradle.kts")
          content = path.read_text(encoding="utf-8")
          pattern = re.compile(r'(?m)^([ \t]*)version[ \t]*=[ \t]*"[^"]+"[ \t]*$')
          updated, count = pattern.subn(
              lambda match: f'{match.group(1)}version = "{version}"',
              content,
              count=1,
          )

          if count != 1:
              raise SystemExit("Could not apply the requested build version.")

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Build plugin
        run: ./gradlew --no-daemon clean build

      - name: Verify and stage plugin
        id: plugin
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.build_version }}"
          EXPECTED_NAME="FragStealers-${VERSION}.jar"
          EXPECTED_JAR="build/libs/${EXPECTED_NAME}"

          if [[ ! -f "$EXPECTED_JAR" ]]; then
            echo "Expected plugin JAR was not created: $EXPECTED_JAR"
            echo "Available files:"
            find build/libs -maxdepth 1 -type f -print || true
            exit 1
          fi

          for REQUIRED_FILE in plugin.yml config.yml; do
            if ! jar tf "$EXPECTED_JAR" | grep -qx "$REQUIRED_FILE"; then
              echo "The built JAR does not contain $REQUIRED_FILE."
              exit 1
            fi
          done

          PLUGIN_VERSION="$(python3 - "$EXPECTED_JAR" <<'PY'
          import re
          import sys
          import zipfile

          jar_path = sys.argv[1]
          with zipfile.ZipFile(jar_path) as archive:
              plugin_yml = archive.read("plugin.yml").decode("utf-8")

          match = re.search(
              r"(?m)^\s*version:\s*['\"]?([^'\"\s]+)['\"]?\s*$",
              plugin_yml,
          )
          if match is None:
              raise SystemExit("Could not read the version from plugin.yml inside the JAR.")

          print(match.group(1))
          PY
          )"

          if [[ "$PLUGIN_VERSION" != "$VERSION" ]]; then
            echo "plugin.yml version does not match the requested build version."
            echo "Build version:      $VERSION"
            echo "plugin.yml version: $PLUGIN_VERSION"
            exit 1
          fi

          RELEASE_DIR="build/release"
          mkdir -p "$RELEASE_DIR"
          cp "$EXPECTED_JAR" "$RELEASE_DIR/$EXPECTED_NAME"

          (
            cd "$RELEASE_DIR"
            sha256sum "$EXPECTED_NAME" > "$EXPECTED_NAME.sha256"
          )

          echo "jar=$RELEASE_DIR/$EXPECTED_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$RELEASE_DIR/$EXPECTED_NAME.sha256" >> "$GITHUB_OUTPUT"
          echo "Built and verified: $RELEASE_DIR/$EXPECTED_NAME"

      - name: Upload development prerelease files
        if: steps.version.outputs.publish_prerelease == 'true'
        shell: bash
        run: |
          gh release upload \
            "${{ steps.version.outputs.release_tag }}" \
            "${{ steps.plugin.outputs.jar }}" \
            "${{ steps.plugin.outputs.checksum }}" \
            --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fragstealers-${{ steps.version.outputs.build_version }}-${{ github.sha }}
          path: |
            ${{ steps.plugin.outputs.jar }}
            ${{ steps.plugin.outputs.checksum }}
          if-no-files-found: error
