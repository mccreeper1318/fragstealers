name: Build FragStealers

run-name: Build FragStealers from ${{ github.ref_name }}

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew --no-daemon clean build

      - name: Verify plugin JAR
        id: plugin
        shell: bash
        run: |
          mapfile -t JARS < <(
            find build/libs \
              -maxdepth 1 \
              -type f \
              -name 'FragStealers-*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              | sort
          )

          if [[ "${#JARS[@]}" -ne 1 ]]; then
            echo "Expected exactly one FragStealers plugin JAR."
            echo "Found: ${#JARS[@]}"
            printf '%s\n' "${JARS[@]}"
            exit 1
          fi

          JAR="${JARS[0]}"

          for REQUIRED_FILE in plugin.yml config.yml; do
            if ! jar tf "$JAR" | grep -qx "$REQUIRED_FILE"; then
              echo "The built JAR does not contain $REQUIRED_FILE."
              exit 1
            fi
          done

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "Built and verified: $JAR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fragstealers-${{ github.sha }}
          path: ${{ steps.plugin.outputs.jar }}
          if-no-files-found: error
